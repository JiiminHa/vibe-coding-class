<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 16px;
      background: #fff;
      color: #333;
    }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    #applyBtn {
      background: #18a0fb;
      color: #fff;
      margin-bottom: 12px;
    }
    #applyBtn:hover { background: #0d8de0; }
    #applyBtn:disabled { background: #a0d4fd; cursor: not-allowed; }
    #status {
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 12px;
      line-height: 1.6;
    }
    #status.error { background: #fff0f0; color: #c0392b; display: block; }
    #status.success { background: #f0fff4; color: #27ae60; display: block; }
    #status.warning { background: #fffbf0; color: #e67e22; display: block; }
    #failedList { margin-top: 8px; padding-left: 12px; }
    #failedList li { margin-bottom: 2px; }
  </style>
</head>
<body>
  <h2>CardFlow 텍스트 삽입</h2>
  <button id="applyBtn">클립보드에서 적용</button>
  <div id="status"></div>

  <script>
    const applyBtn = document.getElementById('applyBtn');
    const statusEl = document.getElementById('status');

    function showStatus(type, message, failedLayers) {
      statusEl.className = type;
      statusEl.innerHTML = message;
      if (failedLayers && failedLayers.length > 0) {
        const ul = document.createElement('ul');
        ul.id = 'failedList';
        failedLayers.forEach(function(name) {
          const li = document.createElement('li');
          li.textContent = name;
          ul.appendChild(li);
        });
        statusEl.appendChild(ul);
      }
    }

    applyBtn.addEventListener('click', async function() {
      applyBtn.disabled = true;
      statusEl.className = '';
      statusEl.innerHTML = '';

      let text;
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        showStatus('error', '클립보드 접근 권한이 없습니다.');
        applyBtn.disabled = false;
        return;
      }

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        showStatus('error', 'CardFlow에서 복사한 내용이 없습니다.');
        applyBtn.disabled = false;
        return;
      }

      if (!data || data.cardflow !== true || !Array.isArray(data.slides)) {
        showStatus('error', 'CardFlow에서 복사한 내용이 없습니다.');
        applyBtn.disabled = false;
        return;
      }

      // code.ts로 전달
      parent.postMessage({ pluginMessage: { type: 'apply', data: data } }, '*');
    });

    // code.ts로부터 결과 수신
    window.onmessage = function(event) {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      applyBtn.disabled = false;

      if (msg.type === 'done') {
        if (msg.failed && msg.failed.length > 0) {
          showStatus(
            'warning',
            '일부 레이어 삽입에 실패했습니다:',
            msg.failed
          );
        } else {
          showStatus('success', '✓ 모든 텍스트가 성공적으로 삽입되었습니다.');
        }
      } else if (msg.type === 'error') {
        showStatus('error', msg.message || '알 수 없는 오류가 발생했습니다.');
      }
    };
  </script>
</body>
</html>
